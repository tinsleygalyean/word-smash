<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#efe9df}a{color:#1f6f8b}a:hover{color:#155264}</style>
</helmet>
<div style="position:relative;width:1200px;height:540px;overflow:hidden;background:#c99f6b;border-radius:8px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none" onPointerDown="{{ down }}" onPointerMove="{{ move }}" onPointerUp="{{ up }}" onPointerCancel="{{ up }}">
  <div style="position:absolute;inset:0;transform:translate({{ sx }}px, {{ sy }}px)">
    <!-- wall -->
    <div style="position:absolute;inset:0 0 46% 0;background:linear-gradient(180deg,#e3c491 0%,#d7b47e 70%,#cba76f 100%)"></div>
    <div style="position:absolute;inset:0 0 46% 0;background:repeating-linear-gradient(90deg,rgba(120,80,40,.14) 0 3px,rgba(255,255,255,.08) 3px 5px,transparent 5px 150px)"></div>
    <div style="position:absolute;left:300px;top:-100px;width:640px;height:400px;background:radial-gradient(ellipse at center,rgba(255,244,214,.5),transparent 70%)"></div>
    <!-- bench -->
    <div style="position:absolute;left:0;right:0;bottom:0;height:54%;background:linear-gradient(180deg,#eed0a0 0%,#e5c188 14%,#d3ab70 15%,#c69c60 100%)"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:54%;background:repeating-linear-gradient(180deg,transparent 0 34px,rgba(120,80,40,.08) 34px 36px)"></div>
    <div style="position:absolute;left:0;right:0;top:46%;height:10px;background:linear-gradient(180deg,#f8e0b4,#eed0a0);box-shadow:0 4px 8px rgba(0,0,0,.18)"></div>

    <!-- tray -->
    <div style="position:absolute;left:427px;top:294px;width:346px;height:132px;border-radius:19px;background:rgba(90,55,20,.22);box-shadow:inset 0 4px 8px rgba(0,0,0,.3)"></div>

    <!-- whole plaque -->
    <sc-if value="{{ whole }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:434px;top:299px;width:332px;height:122px;border-radius:16px;background:linear-gradient(180deg,#faeed2,#f2e0b8);box-shadow:0 5px 0 #a3713d,0 8px 10px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;gap:26px;font:600 66px Fredoka,sans-serif;color:#4a2e18">
        <span>c</span><span>a</span><span>t</span>
      </div>
    </sc-if>

    <!-- flying pieces -->
    <sc-for list="{{ pieces }}" as="pc" hint-placeholder-count="0">
      <div style="position:absolute;left:{{ pc.x }}px;top:{{ pc.y }}px;width:104px;height:118px;border-radius:15px;background:linear-gradient(180deg,#faeed2,#f2e0b8);box-shadow:0 5px 0 #b98a55,0 8px 10px rgba(0,0,0,.26);display:flex;align-items:center;justify-content:center;font:600 62px Fredoka,sans-serif;color:#4a2e18;transform:translate(-50%,-50%) rotate({{ pc.r }}deg)">{{ pc.ch }}</div>
    </sc-for>

    <!-- starburst flash -->
    <sc-if value="{{ flash }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 200 200" style="position:absolute;left:500px;top:250px;width:200px;height:200px;pointer-events:none">
        <polygon points="100,4 116,62 172,38 136,88 196,100 136,112 172,162 116,138 100,196 84,138 28,162 64,112 4,100 64,88 28,38 84,62" fill="#fff3d6" stroke="#e0a13c" stroke-width="5" stroke-linejoin="round"></polygon>
      </svg>
    </sc-if>
  </div>

  <!-- dim overlay for wind-up drama -->
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(40,20,5,.8) 100%);opacity:{{ dim }};pointer-events:none"></div>

  <!-- hammer -->
  <svg viewBox="0 0 120 120" style="position:absolute;left:{{ hx }}px;top:{{ hy }}px;width:150px;height:150px;margin:-75px 0 0 -75px;transform:rotate({{ hr }}deg) scale({{ hs }});pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))">
    <rect x="52" y="34" width="16" height="78" rx="7" fill="#a5713c" stroke="#7c5128" stroke-width="2"></rect>
    <rect x="22" y="12" width="76" height="34" rx="12" fill="#c9553e" stroke="#8f3a29" stroke-width="3"></rect>
    <rect x="30" y="18" width="60" height="8" rx="4" fill="#e88a6f" opacity=".8"></rect>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:540}}">
class Component extends DCLogic {
  state = { phase: 'idle', hx: 1010, hy: 430, hs: 1, hr: -18, dim: 0, flash: false, sx: 0, sy: 0, whole: true, pieces: [] };

  DOCK = { x: 1010, y: 430 };
  TARGET = { x: 600, y: 355 };

  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  getPos(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const k = r.width / 1200;
    return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
  }

  loop() { cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(this.tick); }

  tick = (t) => {
    const s = this.state, dt = Math.min(32, t - (this.lt || t)); this.lt = t;
    const lerp = (a, b, p) => a + (b - a) * p;
    let again = true;
    if (s.phase === 'windup') {
      const p = Math.min(1, (t - this.t0) / 900), e = p * p;
      this.setState({
        hx: lerp(this.from.x, 600, e), hy: lerp(this.from.y, 290, e),
        hs: lerp(this.from.s, 5.2, e), hr: lerp(this.from.r, -145, e), dim: 0.5 * p
      });
      if (p >= 1) { this.t0 = t; this.setState({ phase: 'strike' }); }
    } else if (s.phase === 'strike') {
      const p = Math.min(1, (t - this.t0) / 160), e = p * p;
      this.setState({ hr: lerp(-145, 35, e), hs: lerp(5.2, 2.2, p), hy: lerp(290, 330, p), dim: 0.5 * (1 - p) });
      if (p >= 1) this.smash(t);
    } else if (s.phase === 'smashed') {
      const el = t - this.t0;
      const pieces = s.pieces.map(pc => {
        let { x, y, vx, vy, vr, r } = pc;
        x += vx * dt; y += vy * dt; vy += 0.004 * dt; r += vr * dt;
        if (y > 420 && vy > 0) { vy *= -0.3; vx *= 0.7; vr *= 0.5; y = 420; }
        return { ...pc, x, y, vx, vy, vr, r };
      });
      const shake = el < 400 ? (1 - el / 400) * 7 : 0;
      const hp = Math.min(1, el / 600);
      this.setState({
        pieces, flash: el < 150,
        sx: (Math.random() - 0.5) * 2 * shake, sy: (Math.random() - 0.5) * 2 * shake,
        hx: lerp(600, this.DOCK.x, hp), hy: lerp(330, this.DOCK.y, hp),
        hs: lerp(2.2, 1, hp), hr: lerp(35, -18, hp)
      });
      if (el > 1400) { this.setState({ sx: 0, sy: 0 }); again = false; }
    } else if (s.phase === 'return') {
      const p = Math.min(1, (t - this.t0) / 350), e = 1 - (1 - p) * (1 - p);
      this.setState({
        hx: lerp(this.from.x, this.DOCK.x, e), hy: lerp(this.from.y, this.DOCK.y, e),
        hs: lerp(this.from.s, 1, e), hr: lerp(this.from.r, -18, e), dim: this.from.d * (1 - p)
      });
      if (p >= 1) { this.setState({ phase: 'idle' }); again = false; }
    } else again = false;
    if (again) this.raf = requestAnimationFrame(this.tick); else this.lt = 0;
  };

  smash(t) {
    this.t0 = t;
    const mk = (ch, x, vx, vy, vr) => ({ ch, x, y: 355, vx, vy, vr, r: 0 });
    this.setState({
      phase: 'smashed', whole: false, flash: true, dim: 0,
      pieces: [mk('c', 495, -0.28, -0.75, -0.06), mk('a', 600, 0.03, -0.95, 0.03), mk('t', 705, 0.3, -0.7, 0.07)]
    });
    if (navigator.vibrate) navigator.vibrate(70);
    this.crash();
    this.loop();
  }

  crash() {
    try {
      const ctx = this.ac || (this.ac = new (window.AudioContext || window.webkitAudioContext)());
      if (ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime, v = Math.floor(Math.random() * 3);
      const noise = (dur, type, freq, gain, at) => {
        const b = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = ctx.createBufferSource(); src.buffer = b;
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
        const g = ctx.createGain(); g.gain.setValueAtTime(gain, now + at);
        g.gain.exponentialRampToValueAtTime(0.001, now + at + dur);
        src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(now + at);
      };
      if (v === 0) { // wood crash + thump
        noise(0.5, 'lowpass', 600, 0.9, 0);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.setValueAtTime(160, now); o.frequency.exponentialRampToValueAtTime(45, now + 0.25);
        g.gain.setValueAtTime(0.8, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.32);
      } else if (v === 1) { // glass shatter
        noise(0.25, 'highpass', 4000, 0.5, 0);
        for (let i = 0; i < 10; i++) {
          const o = ctx.createOscillator(), g = ctx.createGain(), at = Math.random() * 0.18;
          o.type = 'sine'; o.frequency.value = 1800 + Math.random() * 4000;
          g.gain.setValueAtTime(0.25, now + at); g.gain.exponentialRampToValueAtTime(0.001, now + at + 0.12);
          o.connect(g); g.connect(ctx.destination); o.start(now + at); o.stop(now + at + 0.14);
        }
      } else { // metal clang
        noise(0.4, 'bandpass', 2800, 0.8, 0);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square'; o.frequency.setValueAtTime(220, now); o.frequency.exponentialRampToValueAtTime(60, now + 0.3);
        g.gain.setValueAtTime(0.35, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.4);
      }
    } catch (err) { /* audio unavailable */ }
  }

  reset() {
    cancelAnimationFrame(this.raf); this.lt = 0;
    this.setState({ phase: 'idle', hx: this.DOCK.x, hy: this.DOCK.y, hs: 1, hr: -18, dim: 0, flash: false, sx: 0, sy: 0, whole: true, pieces: [] });
  }

  renderVals() {
    const s = this.state;
    return {
      ...s,
      down: (e) => {
        e.currentTarget.setPointerCapture(e.pointerId);
        if (s.phase === 'smashed') { this.reset(); return; }
        if (s.phase === 'idle') {
          const p = this.getPos(e);
          if (Math.hypot(p.x - s.hx, p.y - s.hy) < 140) this.setState({ phase: 'drag' });
        }
      },
      move: (e) => {
        if (this.state.phase !== 'drag') return;
        const p = this.getPos(e);
        this.setState({ hx: p.x, hy: p.y });
        if (Math.hypot(p.x - this.TARGET.x, p.y - this.TARGET.y) < 190) {
          this.from = { x: p.x, y: p.y, s: 1, r: -18 };
          this.t0 = performance.now(); this.lt = 0;
          this.setState({ phase: 'windup' });
          this.loop();
        }
      },
      up: () => {
        const ph = this.state.phase;
        if (ph === 'drag' || ph === 'windup') {
          const st = this.state;
          this.from = { x: st.hx, y: st.hy, s: st.hs, r: st.hr, d: st.dim };
          this.t0 = performance.now(); this.lt = 0;
          this.setState({ phase: 'return' });
          this.loop();
        }
      }
    };
  }
}
</script>
</body>
</html>
